[project]
name = "autotyper"
version = "0.1.0"
description = "Type text into any input with human-like rhythm, typos and corrections."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Juan Isern" }]
requires-python = ">=3.12"
keywords = ["typing", "automation", "macos", "keyboard", "screen-recording"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "pynput>=1.8",
    "pyyaml>=6",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/JuanIsernGhosn/autotyper"
Repository = "https://github.com/JuanIsernGhosn/autotyper"
Changelog = "https://github.com/JuanIsernGhosn/autotyper/blob/main/CHANGELOG.md"

[project.scripts]
autotyper = "autotyper.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autotyper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
