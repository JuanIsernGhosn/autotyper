name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Test
        run: |
          uv sync --locked
          uv run pytest -q

      - name: Build wheel
        run: uv build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber dist/*.whl dist/*.tar.gz
          else
            gh release create "$tag" \
              --title "$tag" \
              --generate-notes \
              dist/*.whl dist/*.tar.gz
          fi
